# Sample nginx site for the Lamico platform — adapt the domain, certificate paths and folders.
#
#   client build : npm run build -w client        -> copy client/dist/* to /var/www/lamico
#   API          : node server/dist/server.js     -> listens on 127.0.0.1:4000 (see README "Production")
#   server/.env  : NODE_ENV=production  TRUST_PROXY=true  CLIENT_URL=https://www.example.com
#
# The website and the API MUST share one origin (same domain), because the dashboard login cookie is
# SameSite=Lax and the site calls the API through relative /api URLs.


server {
    listen 80;
    server_name www.example.com example.com;
    return 301 https://www.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lamico;
    index index.html;

    # CV uploads are 5 MB and media up to 50 MB; a little headroom for multipart overhead.
    client_max_body_size 55m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # ── Security headers (same values as client/security-headers.ts) ──
    # Visitor statistics (Plausible/Umami): add your analytics address to script-src and connect-src below,
    # e.g. https://plausible.io — in all three Content-Security-Policy lines.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://www.google.com https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API, uploads, sitemap and robots come from the Node server ──
    # (add_header in a location block replaces the server-level ones, so the API sends its own via helmet.)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: the API trusts exactly one proxy
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/media/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }
    location = /robots.txt  { proxy_pass http://127.0.0.1:4000; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:4000; }

    # ── The React app ──
    # Hashed build files never change: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # location-level add_header replaces the inherited ones, so repeat the important ones:
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # The dashboard must not be indexed by search engines.
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files /index.html =404;
    }

    location / {
        # index.html must be re-checked on every visit so a new deployment is picked up immediately.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://www.google.com https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri /index.html;
    }
}
